name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-latest` переехал на Ubuntu 26.04, а сборок Python 3.9 для неё
        # в actions/python-versions нет (3.9.25 собран только под 22.04/24.04).
        # Держим 3.9 на 24.04, остальные версии — на актуальном образе.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    services:
      # Живой Redis: фейковый клиент не проверяет Lua, TTL и гонки
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      KREMLE_TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          # Всё сразу: иначе интеграционные тесты молча скипаются через importorskip
          # httpx нужен TestClient (fastapi), иначе его тесты молча скипнутся
          pip install -e ".[all,test]"

      - name: Зависимости на месте (иначе тесты скипнутся и CI соврёт)
        run: |
          python - <<'PY'
          import django, fastapi, flask, httpx, itsdangerous, redis
          print('fastapi', fastapi.__version__, '| httpx', httpx.__version__)
          PY

      - name: Смоук-тесты не должны скипаться
        run: |
          set -o pipefail
          out=$(python -m pytest tests/test_demo.py tests/test_e2e.py -q --no-header \
                2>&1 | tee /tmp/smoke.log)
          echo "$out" | tail -3
          if echo "$out" | grep -q skipped; then
            echo "::error::Тесты демо скипнулись — нет fastapi/httpx/uvicorn"
            exit 1
          fi

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v 2>&1 | tee /tmp/pytest.log


      - name: Redis tests must actually run (не скипнуться)
        # Если сервис не поднялся, тесты молча скипнутся и «зелёный» CI соврёт
        run: |
          set -o pipefail
          python - <<'PY'
          import redis, sys
          try:
              redis.from_url('redis://localhost:6379/15').ping()
          except Exception as exc:
              print('Redis недоступен:', exc)
              sys.exit(1)
          print('redis ok')
          PY
          python -m pytest tests/test_redis_live.py -m redis -q --no-header -p no:cacheprovider \
            2>&1 | tee /tmp/redis.log

      - name: Coverage
        if: matrix.python-version == '3.12'
        run: |
          set -o pipefail
          python -m pytest tests/ -q --cov=kremle_detect --cov-report=term-missing \
            --cov-report=json --cov-fail-under=85 2>&1 | tee /tmp/coverage.log

      - name: Coverage по модулям
        # Общий процент прячет провал в одном файле: +300 непокрытых строк
        # рядом с зелёными тестами ничего не меняют. Пороги — в pyproject.toml.
        if: matrix.python-version == '3.12'
        run: python scripts/coverage_gate.py 2>&1 | tee /tmp/coverage-gate.log

      - name: Failure details in annotations
        # Логи Actions лежат на отдельном хосте и не всегда доступны,
        # а аннотации — всегда. Хвост падения видно прямо в PR.
        if: failure()
        run: |
          for f in /tmp/smoke.log /tmp/pytest.log /tmp/redis.log /tmp/coverage.log \
                   /tmp/coverage-gate.log; do
            if [ -f "$f" ]; then
              echo "::error title=$(basename "$f")::$(tail -30 "$f" | tr '\n' '|' | cut -c1-4000)"
            fi
          done

  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # Только ошибки и явные баги (E/F/W/B/UP), без вкусовщины про форматирование
      - name: ruff check
        run: ruff check .

  types:
    # mypy на всей библиотеке. `py.typed` уже лежит в пакете, то есть типы
    # обещаны наружу — значит их надо проверять, а не надеяться.
    name: Типы (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        # Типы проверяем в том же окружении, что и тесты: без optional-зависимостей
        # mypy не видит ветки с anyio/itsdangerous, и `# type: ignore` в них
        # выглядит лишним (warn_unused_ignores честно на него ругается).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"

      - name: mypy kremle_detect
        run: mypy kremle_detect

      - name: py.typed на месте
        # Без маркера типы не доедут до пользователей: mypy в чужом проекте
        # просто проигнорирует пакет.
        run: test -f kremle_detect/py.typed || { echo "::error::нет py.typed"; exit 1; }

  loadtest:
    # Нагрузочный смоук — не гейт, а измерение: числа печатаются в summary PR.
    # Числа на раннере шумные, поэтому падение джоба не блокирует мерж.
    #
    # Меряем дважды: на памяти и на настоящем Redis. Раньше был только первый
    # прогон — а в продакшене хранилище как раз Redis, и «тысячи rps на памяти»
    # ничего не говорили о реальной цене челленджа (сеть + сериализация).
    name: Нагрузочный смоук (не блокирует)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[demo,test]"

      - name: Замер (память)
        # Демо поднимаем в этом же шаге: фоновый процесс из предыдущего шага
        # раннер прибьёт вместе с его шеллом.
        run: |
          set -o pipefail
          kremle-detect serve --port 8000 > /tmp/demo-memory.log 2>&1 &
          DEMO_PID=$!
          trap 'kill "$DEMO_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/kremle/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          if ! curl -fsS http://127.0.0.1:8000/kremle/health > /dev/null; then
            echo "::error::демо не поднялось"; cat /tmp/demo-memory.log; exit 1
          fi
          python scripts/loadtest.py -n 300 -c 20 --label memory \
            --json-out /tmp/loadtest-memory.json 2>&1 | tee /tmp/loadtest.log

      - name: Замер (Redis)
        # То же демо, но хранилище — настоящий Redis из сервиса выше.
        run: |
          set -o pipefail
          KREMLE_REDIS_URL=redis://127.0.0.1:6379/0 \
            kremle-detect serve --port 8001 > /tmp/demo-redis.log 2>&1 &
          DEMO_PID=$!
          trap 'kill "$DEMO_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8001/kremle/health > /dev/null; then
              break
            fi
            sleep 0.5
          done
          if ! curl -fsS http://127.0.0.1:8001/kremle/health > /dev/null; then
            echo "::error::демо на Redis не поднялось"; cat /tmp/demo-redis.log; exit 1
          fi
          python scripts/loadtest.py -n 300 -c 20 --url http://127.0.0.1:8001 \
            --label redis --json-out /tmp/loadtest-redis.json \
            2>&1 | tee -a /tmp/loadtest.log

      - name: Сводка в PR
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          runs = [('память', '/tmp/loadtest-memory.json'),
                  ('Redis', '/tmp/loadtest-redis.json')]
          print('### Нагрузочный смоук (демо, 300 запросов × 20 потоков)\n')
          print('| хранилище | сценарий | rps | p50, ms | p95, ms | ошибок |')
          print('|---|---|---|---|---|---|')
          for label, path in runs:
              file = pathlib.Path(path)
              if not file.exists():
                  print(f'| {label} | _замер не выполнен_ | | | | |')
                  continue
              for name, row in json.loads(file.read_text()).items():
                  print(f"| {label} | {name} | {row['rps']} | {row['p50_ms']} | "
                        f"{row['p95_ms']} | {row['errors']} |")
          print('\n_Раннер GitHub шумный: важно не значение, а порядок величин._')
          print('_Разница между строками «память» и «Redis» — цена сети и '
                'сериализации в хранилище, а не скорость капчи._')
          PY

  docs:
    # Сайт документации должен собираться без битых ссылок.
    # Старый ручной gh-pages отстал на шесть релизов (2.3.4) — больше так не надо.
    name: Документация (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "mkdocs-material>=9.5,<10"

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Проверить, что страницы попали в сборку
        run: |
          set -euo pipefail
          # index.md — это index.html в корне, остальные страницы — каталогами
          test -f site/index.html || { echo "::error::нет главной страницы"; exit 1; }
          pages="install detection captcha questions images operations api cli"
          pages="$pages security faq development testing release react widget snippets"
          pages="$pages integrations/flask integrations/django integrations/fastapi"
          pages="$pages integrations/starlette integrations/litestar"
          pages="$pages integrations/bare-core integrations/spa"
          for page in $pages; do
            test -f "site/${page}/index.html" || { echo "::error::нет страницы $page"; exit 1; }
          done
          echo "все страницы собраны"
          # статическое демо: страница + бандл, иначе ссылка из README ведёт в 404
          test -f site/demo.html || { echo "::error::нет статического демо (docs/demo.html)"; exit 1; }
          test -f site/assets/kremle-widget.min.js || {
            echo "::error::в сборку не попал бандл виджета для демо"; exit 1; }
          echo "статическое демо собрано"

  package:
    # Проверяем, что пакет собирается и данные попадают в wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - name: Check package data
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith('templates/kremle_captcha.html') for n in names), names
          for module in ('policy.py', 'metrics.py', 'session.py', 'demo.py',
                         'storage_async.py', 'questions/sdamgia.py', 'images.py'):
              assert any(n.endswith(module) for n in names), module
          # маркер типов: без него mypy/pyright считают пакет untyped
          assert any(n.endswith('kremle_detect/py.typed') for n in names), names
          print('ok:', wheel)
          PY

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kremle-react
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # jsdom 30 требует Node ^22.22.2

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  widget:
    # Виджет без React: тесты, сборка и сверка собранного бандла с тем,
    # что лежит в репозитории. Если бандл разъехался с исходниками — падаем.
    name: Виджет (kremle-widget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kremle-widget
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Проверить IIFE-сборку (капча проходит без сборщика)
        run: node scripts/check-dist.mjs

      - name: Бандл в репозитории совпадает с исходниками
        run: |
          set -euo pipefail
          cp dist/kremle-widget.js dist/kremle-widget.min.js dist/kremle-widget.mjs \
             ../kremle_detect/static/widget/
          if ! git diff --quiet -- ../kremle_detect/static/widget/; then
            echo "::error::kremle_detect/static/widget устарел — запустите в kremle-widget: npm run build && cp dist/*.js dist/*.mjs ../kremle_detect/static/widget/"
            git diff --stat -- ../kremle_detect/static/widget/
            exit 1
          fi
          echo "бандл в репозитории актуален"

      - name: Проверить, что wheel содержит виджет
        run: |
          set -o pipefail
          python3 -m venv /tmp/pkg
          /tmp/pkg/bin/pip install --quiet build
          (cd .. && /tmp/pkg/bin/python -m build --wheel --outdir /tmp/widget-dist >/dev/null)
          /tmp/pkg/bin/python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('/tmp/widget-dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = 'kremle_detect/static/widget/kremle-widget.min.js'
          assert expected in names, [n for n in names if 'widget' in n]
          print('виджет в wheel:', expected)
          PY

  security:
    # Адвайзори-проверки: падение не должно блокировать релиз, но должно быть видно
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict --desc || true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # jsdom 30 требует Node ^22.22.2

      - name: npm audit
        working-directory: kremle-react
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high || true
