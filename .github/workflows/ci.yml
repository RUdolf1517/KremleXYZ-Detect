name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          # Всё сразу: иначе интеграционные тесты молча скипаются через importorskip
          pip install -e ".[all]" pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  package:
    # Проверяем, что пакет собирается и HTML-шаблон попадает в wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - name: Check package data
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith('templates/kremle_captcha.html') for n in names), names
          print('ok:', wheel)
          PY

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kremle-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
