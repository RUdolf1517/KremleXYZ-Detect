name: Pages

# Сайт документации вместе со статическим демо:
#   https://rudolf1517.github.io/KremleXYZ-Detect/
#
# Публикуется из Actions, а не из ветки gh-pages: собранный сайт — артефакт,
# а не второй набор исходников, который неизбежно отстаёт (ручной gh-pages
# застрял на 2.3.4, пока пакет ушёл на 2.11).
#
# Нужен один разовый переключатель в настройках репозитория:
#   Settings → Pages → Build and deployment → Source: **GitHub Actions**.
# Пока он не нажат, сайт всё равно собирается (артефакт `github-pages`),
# а деплой пропускается с предупреждением — main не краснеет.
#
# Включён ли Pages и каким способом, спрашиваем у API по `build_type`:
#   none      — Pages выключен;
#   workflow  — источник «GitHub Actions», можно публиковать;
#   legacy    — источник «Deploy from a branch», наш артефакт не подойдёт.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write       # чтение настроек Pages и загрузка артефакта
      id-token: write
    outputs:
      build_type: ${{ steps.probe.outputs.build_type }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install mkdocs
        run: pip install "mkdocs-material>=9.5,<10"

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Проверить демо и бандл в сборке
        run: |
          set -euo pipefail
          test -f site/index.html || { echo "::error::нет главной страницы"; exit 1; }
          test -f site/demo.html || { echo "::error::нет статического демо"; exit 1; }
          test -f site/assets/kremle-widget.min.js || {
            echo "::error::в сборку не попал бандл виджета"; exit 1; }
          echo "сайт и демо собраны"

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Что настроено в репозитории — знает API, а не догадки. 404 = Pages нет.
      - name: Определить режим Pages
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          err=$(mktemp)
          if build_type=$(gh api "/repos/${REPO}/pages" --jq '.build_type' 2>"$err"); then
            :
          else
            # 404 — Pages не включён; 403 — у токена нет прав на чтение настроек.
            message=$(tr '\n' ' ' < "$err")
            case "$message" in
              *404*|*"Not Found"*) build_type=none ;;
              *) echo "::warning title=Pages::не удалось прочитать настройки: ${message}"; build_type=unknown ;;
            esac
          fi
          [ -n "$build_type" ] || build_type=none
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          echo "Pages build_type: ${build_type}"

      - name: Подсказка, если публиковать пока некуда
        if: steps.probe.outputs.build_type != 'workflow'
        run: |
          echo "::warning title=Pages::Сайт собран, но не опубликован (build_type=${{ steps.probe.outputs.build_type }}). Нужно: Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Затем Actions -> Pages -> Run workflow."
          echo "Готовая сборка лежит в артефакте github-pages этой задачи."
          echo "Настройки: https://github.com/${GITHUB_REPOSITORY}/settings/pages"

  deploy:
    name: Публикация
    needs: build
    # Публикуем только когда источник — GitHub Actions. При legacy-источнике
    # deploy-pages всё равно упал бы, а при выключенном Pages — не стартовал.
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4

      # Проверяем не «джоб зелёный», а что страница действительно отдаётся:
      # Pages обновляется не мгновенно, поэтому с повторами.
      - name: Проверить живой сайт
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -o pipefail
          echo "публикуем: ${PAGE_URL}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "${PAGE_URL}" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "попытка ${i}: HTTP ${code}, ждём"
            sleep 6
          done
          test "$code" = "200" || { echo "::error::сайт не отвечает 200 (HTTP ${code})"; exit 1; }

          for path in "demo.html" "assets/kremle-widget.min.js" "integrations/starlette/" "integrations/litestar/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "${PAGE_URL}${path}" || true)
            echo "${path} -> HTTP ${code}"
            test "$code" = "200" || { echo "::error::${PAGE_URL}${path} отдал ${code}"; exit 1; }
          done
          echo "сайт и демо доступны"
