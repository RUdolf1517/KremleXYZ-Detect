name: Release

# Публикация по тегу: git tag v2.7.0 && git push origin v2.7.0
#
# PyPI — trusted publishing (OIDC), токен не нужен:
#   PyPI → Account → Publishing → Add a pending publisher:
#     project: kremle-detect, owner: RUdolf1517, repo: KremleXYZ-Detect,
#     workflow: release.yml, environment: pypi
#
# npm — два пути:
#   1) Первый релиз пакета: granular token (секрет NPM_TOKEN). OIDC не умеет
#      публиковать самую первую версию — пакета ещё нет в реестре.
#      Write-токены npm живут максимум 90 дней (по умолчанию 7) — ставьте
#      короткий срок и удалите токен после настройки OIDC.
#   2) Дальше — trusted publishing (OIDC): npmjs.com → kremle-react → Settings →
#      Trusted publishing → GitHub Actions (RUdolf1517 / KremleXYZ-Detect /
#      release.yml), обязательно включив «Allow npm publish».
#      Токен после этого не нужен, секрет можно удалить.
#
# Если OIDC на PyPI недоступен, добавьте секрет PYPI_API_TOKEN и раскомментируйте
# строку password в шаге публикации.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          init = open('kremle_detect/__init__.py', encoding='utf-8').read()
          init_version = re.search(r"__version__ = '([^']+)'", init).group(1)
          assert version == tag, f'pyproject: {version} != tag {tag}'
          assert init_version == tag, f'__init__: {init_version} != tag {tag}'
          print('version ok:', tag)
          PY

      - name: Build
        run: |
          set -o pipefail
          pip install build
          python -m build 2>&1 | tee /tmp/build.log

      - name: Surface build failure in annotations
        if: failure()
        run: |
          echo "::error title=build tail::$(tail -30 /tmp/build.log 2>/dev/null | tr '\n' '|' | cut -c1-900)"

      - name: Check package data
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          for expected in (
              'templates/kremle_captcha.html',
              'policy.py', 'metrics.py', 'session.py',
              'storage_async.py', 'questions/sdamgia.py',
              'integrations/_common.py', 'demo.py',
          ):
              assert any(n.endswith(expected) for n in names), expected
          print('ok:', wheel)
          PY

      - name: Smoke install (wheel ставится и CLI живой)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "$(ls dist/*.whl)[demo]" "httpx"
          /tmp/smoke/bin/kremle-detect --version
          /tmp/smoke/bin/kremle-detect questions --help >/dev/null
          /tmp/smoke/bin/python -c "from kremle_detect.demo import build_app; build_app()"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kremle-detect
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Повторный запуск по тому же тегу: файлы уже загружены — это не ошибка
          skip-existing: true
        # password: ${{ secrets.PYPI_API_TOKEN }}   # если публикуете токеном

  npm:
    name: Publish kremle-react to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # provenance
    defaults:
      run:
        working-directory: kremle-react
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'   # OIDC trusted publishing требует Node >= 22.14
          registry-url: 'https://registry.npmjs.org'

      - name: npm CLI >= 11.5.1 (нужен для OIDC)
        run: |
          npm install -g npm@latest
          echo "node $(node --version), npm $(npm --version)"

      - name: Install
        run: npm ci

      - name: Test + build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Check version matches tag
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (pkg.version !== tag) {
              console.error(\`package.json \${pkg.version} != tag \${tag}\`);
              process.exit(1);
            }
            console.log('version ok:', tag);
          "

      - name: Эта версия уже на npm?
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "kremle-react@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "kremle-react@${version} уже опубликован — публикацию пропускаю."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "kremle-react@${version} в реестре нет — публикую."
          fi

      - name: Publish (только OIDC, без токена)
        if: steps.published.outputs.exists != 'true'
        # Токен намеренно не передаём: публикация должна пройти по trusted
        # publishing. Если OIDC сломается, job упадёт с ENEEDAUTH — это громко
        # и сразу, а не через 90 дней, когда протухнет очередной токен.
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          echo "node $(node --version), npm $(npm --version)"
          npm publish --provenance --access public

      - name: Проверить, что публикация ушла по OIDC
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          attest=$(curl -fsS "https://registry.npmjs.org/-/npm/v1/attestations/kremle-react@${version}" || true)
          if echo "$attest" | grep -q 'slsa.dev/provenance'; then
            echo "::notice::kremle-react@${version} опубликован с provenance (SLSA)"
          else
            echo "::warning title=Provenance::у kremle-react@${version} нет attestation — проверьте trusted publishing"
          fi

      - name: Проверить, что версия реально доступна
        # npm может принять публикацию, но оставить её в staged-режиме
        # (нужно подтверждение 2FA мейнтейнера). Джоб при этом зелёный,
        # а в реестре вместо пакета лежит заглушка 0.0.0-stage — предупреждаем явно.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "kremle-react@${version}" version >/dev/null 2>&1; then
            echo "::notice::kremle-react@${version} опубликован и доступен"
          else
            latest=$(npm view kremle-react version 2>/dev/null || echo '—')
            echo "::warning title=Staged publish::kremle-react@${version} принят и ждёт подтверждения (2FA). Подтвердить: npm stage list kremle-react && npm stage approve <id> — или npmjs.com → kremle-react → Staged publishes → Approve. Пока не подтверждено, latest в реестре остаётся ${latest}."
          fi

  github-release:
    name: GitHub Release
    # Релиз с артефактами появляется даже если публикация в индекс упала:
    # по тегу видно, что собралось, а что требует настройки (PyPI/npm).
    needs: [build, pypi, npm]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## \[/{n++} n==1' CHANGELOG.md | head -n -1)
          # Повторный запуск по тому же тегу не должен падать: релиз уже есть —
          # перезаливаем артефакты, а не создаём второй.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "kremle-detect $GITHUB_REF_NAME" \
              --notes "$notes"
          fi
