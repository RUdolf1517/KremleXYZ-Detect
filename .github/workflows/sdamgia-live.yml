name: Решу ЕГЭ (живой портал)

# Провайдер вопросов проверяется на реальных страницах портала, а не только на
# фикстурах. В обычном CI сеть к sdamgia.ru недоступна/нежелательна, поэтому это
# отдельный workflow: по расписанию и руками.
#
# Что ловит: смену вёрстки `/problem?id=`, изменение ответа `newapi/general`,
# отвалившийся TLS. Если краснеет — смотрите `kremle_detect/questions/sdamgia.py`
# (парсер `_ProblemHTMLParser` и `discover_problem_ids`).

on:
  schedule:
    - cron: '0 6 * * *'   # каждый день в 06:00 UTC
  workflow_dispatch:
    inputs:
      problem_id:
        description: 'Проверить конкретное задание'
        default: '1001'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e .

      - name: Check one problem (разбор + картинки)
        run: |
          kremle-detect questions check "${{ inputs.problem_id || '1001' }}" --json \
            | tee problem.json
          python - <<'PY'
          import json
          data = json.load(open('problem.json'))
          assert data['condition'], 'условие не разобралось'
          assert data['answer'], 'ответ не разобрался'
          print('условие:', data['condition'][:120])
          print('ответ:', data['answer'])
          print('картинок:', len(data['images']))
          print('годится для капчи:', data['usable'])
          PY

      - name: Скачать рисунки задания в локальный кеш (--download)
        # Проверяем то, что обычный CI проверить не может: реально ли портал
        # отдаёт файлы рисунков (Content-Type, доступность, отсутствие 403 на
        # горячую ссылку) и читаются ли они потом из кеша.
        run: |
          kremle-detect questions check "${{ inputs.problem_id || '1001' }}" \
            --images --download --json | tee problem-images.json
          python - <<'PY'
          import json
          import sys

          from kremle_detect import images

          data = json.load(open('problem-images.json'))
          cached = data.get('images_cached') or []
          if not data['images']:
              print('у задания нет рисунков — проверять нечего')
              sys.exit(0)

          bad = [item for item in cached if not item.get('ok')]
          assert not bad, f'рисунки не скачались: {bad}'
          assert cached, 'картинки есть, а в кеш ничего не попало'
          for item in cached:
              entry = images.read_image(item['key'])
              assert entry and entry['bytes'], f'файл {item["key"]} не читается из кеша'
              print(f'ok: {item["local"]} — {item["size"]} B, {item["content_type"]}')
          print('всего рисунков в кеше:', images.stats()['count'])
          PY

      - name: Sync с рисунками и чистка кеша
        # Заодно проверяем `--download` на пачке заданий и что кеш можно
        # ограничить по размеру (`questions images --prune`).
        run: |
          kremle-detect questions sync -c math -n 2 --images --download
          kremle-detect questions images
          kremle-detect questions images --prune 1
          kremle-detect questions images

      - name: Discover problem ids (newapi/general → страницы вариантов)
        run: |
          python - <<'PY'
          from kremle_detect.questions.sdamgia import discover_problem_ids
          ids = discover_problem_ids('math', limit=5)
          print('найдено id:', ids)
          assert ids, 'портал не отдал ни одного id задания'
          PY

      - name: Sync dry-run
        run: kremle-detect questions sync -c math -n 3 --dry-run

      - name: Upload parsed problem
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdamgia-problem
          path: problem.json
          if-no-files-found: ignore
