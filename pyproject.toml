[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kremle-detect"
version = "2.12.0"
description = "Защита сайта от пользователей Яндекс Браузера и переходов с Яндекса. Капча с вопросами ЕГЭ."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "RUdolf1517" },
]
keywords = ["captcha", "yandex", "detect", "flask", "django", "fastapi", "starlette",
            "litestar", "bot-protection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.urls]
Homepage = "https://github.com/RUdolf1517/KremleXYZ-Detect"
Repository = "https://github.com/RUdolf1517/KremleXYZ-Detect"
Issues = "https://github.com/RUdolf1517/KremleXYZ-Detect/issues"

[project.optional-dependencies]
flask = ["flask>=2.0"]
django = ["django>=3.2"]
# itsdangerous нужен starlette SessionMiddleware (куки капчи)
fastapi = ["fastapi>=0.68", "jinja2>=3.0", "itsdangerous>=2.0"]
starlette = ["starlette>=0.27", "itsdangerous>=2.0"]
litestar = ["litestar>=2.0"]
redis = ["redis>=4.0"]
# Трейсы «challenge → verify» и JSON-логи. Без extras всё работает: спаны — no-op.
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20",
        "opentelemetry-exporter-otlp>=1.20"]
demo = ["fastapi>=0.68", "uvicorn>=0.20", "itsdangerous>=2.0"]
all = ["flask>=2.0", "django>=3.2", "fastapi>=0.68", "jinja2>=3.0",
       "redis>=4.0", "uvicorn>=0.20", "itsdangerous>=2.0",
       "starlette>=0.27", "litestar>=2.0",
       "opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20",
       "opentelemetry-exporter-otlp>=1.20"]
# Для запуска тестов: httpx нужен TestClient, fakeredis — тесты Redis без сервера
test = ["pytest>=7.0", "pytest-cov>=4.0", "httpx>=0.24", "fakeredis[lua]>=2.10",
         "ruff>=0.6", "mypy>=1.8", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
kremle-detect = "kremle_detect.cli:main"

[tool.setuptools.packages.find]
include = ["kremle_detect*"]

[tool.setuptools.package-data]
kremle_detect = ["templates/*.html", "py.typed", "static/widget/*.js", "static/widget/*.mjs"]

[tool.ruff]
# Лёгкий набор: ошибки и неиспользуемый код, без вкусовщины про форматирование.
target-version = "py39"
line-length = 100
exclude = [".git", "build", "dist", "kremle-react", "kremle-widget", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",   # длину строк держим глазами: в docstring таблицы и команды
    "B008",   # Depends()/Query() в дефолтах — нормальная практика FastAPI
    # проект держит Python 3.9: `X | None` и `list[int]` в аннотациях, которые
    # вычисляются в рантайме (FastAPI, get_type_hints), там падают
    "UP006", "UP035", "UP045",
    "UP009",  # `# -*- coding: utf-8 -*-` — сознательный стиль файлов
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]   # assert False / pytest.raises(Exception) в тестах

[tool.pytest.ini_options]
testpaths = ["tests"]
# Redis-тесты требуют живого сервера: pytest -m redis (в CI — сервис redis)
markers = [
    "redis: требует запущенного Redis (KREMLE_TEST_REDIS_URL, по умолчанию redis://localhost:6379/15)",
]

# Гейт покрытия по модулям (см. scripts/coverage_gate.py).
# Общий порог остаётся в CI (--cov-fail-under=85), но он не видит провал в
# одном файле, если рядом добавили триста строк. У этих модулей порог свой:
# ошибка в них дороже всего — демо (первое, что видит человек), хранилище
# (общее состояние) и FastAPI-интеграция (самый частый вариант подключения).
[tool.kremle.coverage]
overall = 90
"kremle_detect/demo.py" = 95
"kremle_detect/storage.py" = 95
"kremle_detect/integrations/fastapi_ext.py" = 95
"kremle_detect/session.py" = 95
"kremle_detect/detector.py" = 100

[tool.mypy]
files = ["kremle_detect"]
# Самая старая версия, которую ещё понимает mypy. Синтаксис под 3.9 держат
# ruff (target-version = "py39") и тесты в матрице CI на самом 3.9.
python_version = "3.10"
# Строгий mypy на непроверенном коде шумит и его отключают. Здесь наоборот:
# проверяются даже тела функций без аннотаций, а голый `x: str = None`
# (неявный Optional) считается ошибкой — он и в жизни приводит к TypeError.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Сторонние библиотеки без стабов не должны ронять джоб; для своих модулей
# `# type: ignore` разрешён только с кодом и причиной.
ignore_missing_imports = true

[tool.coverage.run]
source = ["kremle_detect"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
